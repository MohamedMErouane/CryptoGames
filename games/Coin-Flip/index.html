<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Coin Flip Game</title>
</head>
<body>

<div class="container">
  <h1>🎲 Coin Flip Game</h1>

  <div class="player-info">
    <p>Score: <span id="player-score">100</span> pts</p>
  </div>

  <div class="bet-controls">
    <label>
      Bet Amount:
      <input type="number" id="bet-amount" min="1" value="10"/>
    </label>
    <div class="choose-side">
      <label><input type="radio" name="choice" value="heads" checked/> Heads</label>
      <label><input type="radio" name="choice" value="tails"/> Tails</label>
    </div>
  </div>

  <div class="stats">
    <p id="heads-count">Heads: 0</p>
    <p id="tails-count">Tails: 0</p>
  </div>

  <div class="coin" id="coin">
    <div class="heads">
      <img src="./assets/heads.svg" />
    </div>
    <div class="tails">
      <img src="./assets/tails.svg" />
    </div>
  </div>

  <div class="message" id="result-msg">Make your bet!</div>

  <div class="buttons">
    <button id="flip-button">Flip Coin</button>
    <button id="reset-button">Reset</button>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
